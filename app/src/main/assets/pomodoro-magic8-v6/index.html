<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff6b62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="番茄专注">
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/magic8.css"><title>番茄专注 Pro</title>
</head>
<body>
<div class="app">
<header class="header">
 <div><div class="brand">POMODORO PRO</div><h1>早上好 👋</h1><p>专注当下，遇见更好的自己</p></div>
 <button class="round-icon">🍅</button>
</header>
<main>
<section class="goal card"><div><span>今日专注目标</span><b><em id="count">0</em> / 8 🍅</b></div><div class="track"><i id="progress"></i></div></section>
<section class="timer card">
 <div class="label">专注时间</div>
 <div class="dial" id="dial"><div class="dial-in"><div class="tomato">🍅</div><strong id="time">25:00</strong><small id="state">准备开始</small></div></div>
 <div class="buttons"><button id="start">▶ 开始专注</button><button id="reset">重置</button></div>
 <p>专注 25 分钟 · 休息 5 分钟 · 每 4 轮长休息</p>
</section>
<section class="card stats"><h2>今日数据</h2><div><article><b id="tomatoes">0</b><span>番茄</span></article><article><b id="minutes">0</b><span>分钟</span></article><article><b>1</b><span>连续天</span></article></div></section>
<section class="card quick"><h2>快捷入口</h2><div><button>📚<span>任务</span></button><button>🤖<span>AI计划</span></button><button>📊<span>统计</span></button><button>👤<span>我的</span></button></div></section>
</main>
<nav><button class="active">⌂<small>首页</small></button><button>🍅<small>专注</small></button><button>✓<small>任务</small></button><button>◷<small>统计</small></button><button>✦<small>AI</small></button></nav>
</div>
<script src="js/app.js"></script>
</body></html>
